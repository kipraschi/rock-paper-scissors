<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css"></link>
</head>
<body>
        <div class="header">
            <div>Rock Paper Scissors</div>
        </div>
        <div class="content">
            <div class="score">
                <div class="playerScore">Player: X</div>
                <div class="computerScore">Computer: X</div>
            </div>
            <div class="buttons"></div>
            <div class="footer">
                <div class="win">You win!</div>
                <div class="tie">It's a&nbsp;<span>draw.</span></div>
                <div class="restart">
                    <button class="restart" disabled="true"></button>
                </div>
            </div>
        </div>
</body>
</html>
